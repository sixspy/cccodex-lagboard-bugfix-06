name: lagboard-bugfix-06


services:
  app:
    build: .
    ports:
      - "10831:8000"
    volumes:
      # 库文件挂冻写专卷：到达流水与冻写审计同库落盘，compose 重建不丢切断记录。
      - lagboard-freeze-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lagboard-freeze-data:
